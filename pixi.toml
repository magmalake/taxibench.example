[workspace]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "taxibench.example"
description = "The NYC taxi query suite over Apache Iceberg, run twice — once on iceberg-mojo from mojoshelf, once on PyIceberg — and packaged as two container images."
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
version = "0.1.0"
# Required for git source dependencies; `pixi shelf add` says so if it is missing.
preview = ["pixi-build"]

[tasks]
# The benchmark binary. Everything else here is a wrapper around it.
build = { cmd = "mkdir -p build && mojo build src/main.mojo -I src -o build/taxibench" }
# The diagnostic: one scan, any projection, timed. Not part of the suite — it
# exists to isolate a cost rather than to report a benchmark. See src/probe.mojo.
build-probe = { cmd = "mkdir -p build && mojo build src/probe.mojo -I src -o build/taxibench-probe" }
# The suite against the local warehouse, both implementations, then a diff of
# the answers. See scripts/bench.sh.
bench = { cmd = "bash scripts/bench.sh" }
# Download the TLC months and have PyIceberg build the table. Needs `uv`.
load = { cmd = "bash scripts/load.sh" }
# Transcode the Iceberg table into a Lance dataset: a second copy of the same
# rows in a different format, which is what the third engine reads. Needs `uv`.
# See "The Lance leg" in the README for what that copy costs and what it means.
convert-lance = { cmd = "bash scripts/convert-lance.sh" }
# The suite over the Lance dataset and over the Iceberg table beside it, in one
# session, then a diff of the answers. See scripts/bench-lance.sh.
bench-lance = { cmd = "bash scripts/bench-lance.sh" }
# The PostgreSQL copy of the same rows: a throwaway cluster under build/ on a
# free port, then the same 79,478,796 trips through a binary COPY. Needs the
# TLC Parquet `load` downloads, and the `postgres` environment below.
load-postgres = { cmd = "bash scripts/load-postgres.sh" }
# The suite through PostgreSQL, both legs, then the same answer diff.
bench-postgres = { cmd = "bash scripts/bench-postgres.sh" }
# The answers-must-match gate on its own, over whatever results are in build/.
verify = { cmd = "python3 scripts/compare.py build/results-mojo.jsonl build/results-python.jsonl" }
fmt = { cmd = "mojo format src" }

[dependencies]
mojo = "==1.0.0"
# Added by `pixi shelf add iceberg-mojo`: the tin comes from GitHub as a pixi
# source dependency, pinned at the revision mojoshelf published. Its own
# dependencies — parquet, avro, thrift, zstd, lz4, brotli, objectstore and the
# rest — come along with it.
iceberg-mojo = { git = "https://github.com/magmalake/iceberg.mojo.git", rev = "3c54d66d3a41db7b55e8dee6396a51965d71953e" }

# The PostgreSQL leg needs a server, and only a server: initdb, pg_ctl,
# pg_isready and psql, which scripts/pg-server.sh uses to raise a throwaway
# cluster on a free port under build/. It is a separate feature and a separate
# environment so that the Mojo toolchain and the database never have to solve
# against each other — `pixi run -e postgres ...` materialises about 50 MB and
# leaves the default environment untouched.
[feature.postgres.dependencies]
postgresql = ">=16,<19"

[environments]
postgres = { features = ["postgres"], no-default-feature = true }
